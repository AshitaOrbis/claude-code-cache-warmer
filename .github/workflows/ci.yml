name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Lint and tests only read the tree. Declared explicitly so the job keeps a
# read-only GITHUB_TOKEN even if the repo/org default is ever widened
# (gh audit 2026-07-26, F5).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          jq --version

      # ShellCheck on every tracked shell script. severity=warning catches real
      # bugs (unset vars, bad quoting, status confusion) while tolerating the
      # repo's deliberate aligned-comment / style choices. -x follows `source`.
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -x --severity=warning \
            cache-warmer.sh install.sh lib/classify.sh lib/units.sh tests/run.sh \
            replay-warmer.sh tests/run-v3.sh tests/run-burn-queue.sh \
            tests/live-replay-gate.sh shell-guard.sh

      # shfmt format check on the files this repo formats with shfmt (lib/ +
      # tests/). cache-warmer.sh / install.sh predate shfmt adoption and use an
      # aligned-comment style shfmt would collapse, so they are not gated here.
      # The binary is fetched from a GitHub release, so verify it before running it:
      # a release asset can be replaced by whoever controls the upstream repo, and
      # this step executes it as root on the runner (gh audit 2026-07-26, F6). The
      # hash below is mvdan/sh's own published sha256sums.txt for v3.8.0.
      - name: shfmt (format check)
        run: |
          SHFMT_SHA256=27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /tmp/shfmt
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
          shfmt -i 2 -ci -d lib/classify.sh tests/run.sh

      # Python parsers must byte-compile (syntax + import sanity).
      - name: py_compile
        run: |
          python3 -m py_compile lib/jsonl.py measure-ttl.py \
            warm-replay.py tests/fake_anthropic.py tests/review-regressions.py

      # Core-logic test suite (parsing, classification, submit detection).
      # Never forks a live Claude session — pure fixture-driven logic.
      - name: Run tests
        run: bash tests/run.sh

      # v3 plus merged burn-queue suite: proxy retention, v2 discovery, warmer
      # gating, replay body-capping, and TTL sampling. Hermetic — temp HOME,
      # stub replay, local fake SSE server; never calls Anthropic/install.sh.
      - name: Run v3 and burn-queue tests
        run: bash tests/run-v3.sh
